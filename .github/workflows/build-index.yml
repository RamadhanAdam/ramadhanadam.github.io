name: Build Article Index

on:
  push:
    paths:
      - 'articles/*.md'
      - '.github/scripts/build_index.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: python .github/scripts/build_index.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update articles index.json"